---
# cPanel deploys the theme here when you click "Deploy HEAD Commit".
# Change the DEPLOYPATH line to your test site's folder (see cPanel → Domains → Document Root),
# keeping /wp-content/themes/fleuriste/ at the end.
deployment:
  tasks:
    - export DEPLOYPATH=/home/CPANELUSER/test.yourdomain.mu/wp-content/themes/fleuriste/
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/cp -R assets inc parts patterns styles templates $DEPLOYPATH
    - /bin/cp functions.php style.css theme.json screenshot.png readme.txt $DEPLOYPATH
